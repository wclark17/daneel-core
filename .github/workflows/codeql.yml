name: CodeQL

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "daneel-core.mjs"
      - "openclaw.mjs"
      - "packages/**"
      - "scripts/**"
      - "src/**"
  push:
    branches:
      - main
      - hardened-memory-core
    paths:
      - ".github/workflows/**"
      - "daneel-core.mjs"
      - "openclaw.mjs"
      - "packages/**"
      - "scripts/**"
      - "src/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
