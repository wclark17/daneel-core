name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - hardened-memory-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Syntax check Daneel Core launchers
        run: |
          node --check daneel-core.mjs
          node --check openclaw.mjs
          node --check scripts/secrets/daneel-core-onepassword-resolver.mjs

      - name: Build strict smoke
        run: corepack pnpm build:strict-smoke
